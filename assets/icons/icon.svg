<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (squircle moderno) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Moldura de brilho sutil -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Círculo central com sombra -->
  <circle cx="256" cy="256" r="160" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="3" filter="url(#glow)"/>

  <!-- Símbolo de Cifrão / Lucro estilizado -->
  <path d="M256 120 V392" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M330 190 C330 145, 182 145, 182 220 C182 300, 330 270, 330 335 C330 400, 182 400, 182 355" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gráfico de barras ascendente na base -->
  <rect x="156" y="320" width="22" height="40" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="190" y="295" width="22" height="65" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="298" y="260" width="22" height="100" rx="4" fill="url(#primaryGrad)"/>
  <rect x="332" y="225" width="22" height="135" rx="4" fill="url(#accentGrad)"/>
</svg>
